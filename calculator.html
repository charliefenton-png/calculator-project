<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="calcContainer">
      <input type="text" class="calcWindow" name="calcDisplay" id="calcDisplay" value="0" 
        inputmode="decimal" aria-label="number display" autofocus="" data-sharkid="__1">
      <div class="allButtons"> 
       <div class="buttonsThreeRows">
        <div class="buttonsOne">
          <button id="one" class="digit">7</button>
          <button id="two" class="digit">8</button>
          <button id="three" class="digit">9</button>
        </div>
        <div class="buttonsTwo">
          <button id="four" class="digit">4</button>
          <button id="five" class="digit">5</button>
          <button id="six" class="digit">6</button>
        </div>
        <div class="buttonsThree">
          <button id="seven" class="digit">1</button>
          <button id="eight" class="digit">2</button>
          <button id="nine" class="digit">3</button>
        </div>
       </div>  
        <div class="buttonZero">
          <button id="zero" class="digit">0</button>
          <button class="period">.</button>
          <button class="clear">Clear</button>
        </div>
        <div class="operatorSymbols">
          <button class="plus">+</button>
          <button class="minus">-</button>
          <button class="times">x</button>
          <button class="divide">÷</button>
          <button class="equals">=</button>
        </div>
      </div> 




    </div>


    <script src="calculator.js"></script>
</body>
</html>
