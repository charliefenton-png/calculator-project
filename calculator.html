<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="calcContainer">
      <input type="text" class="calcWindow" name="calcDisplay" id="input" value="0" 
        inputmode="decimal" aria-label="number display" autofocus="">
      <div class="allButtons"> 
       <div class="buttonsThreeRows">
        <div class="buttonsOne">
          <button id="one" class="digit" value="7">7</button>
          <button id="two" class="digit" value="8">8</button>
          <button id="three" class="digit" value="9">9</button>
        </div>
        <div class="buttonsTwo">
          <button id="four" class="digit" value="4">4</button>
          <button id="five" class="digit" value="5">5</button>
          <button id="six" class="digit" value="6">6</button>
        </div>
        <div class="buttonsThree">
          <button id="seven" class="digit" value="1">1</button>
          <button id="eight" class="digit" value="2">2</button>
          <button id="nine" class="digit" value="3">3</button>
        </div>
       </div>  
        <div class="buttonZero">
          <button id="zero" class="digit" value="0">0</button>
          <button class="period">.</button>
          <button class="clear">Clear</button>
        </div>
        <div class="operatorSymbols">
          <button class="plus" value="+">+</button>
          <button class="minus" value="-">-</button>
          <button class="times" value="*">x</button>
          <button class="divide" value="/">÷</button>
          <button class="equals" value="=">=</button>
        </div>
      </div> 




    </div>


    <script src="calculator.js"></script>
</body>
</html>
