<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="calcContainer">
      <input type="text" class="calcWindow" name="calcDisplay" id="calcDisplay" value="0" 
        inputmode="decimal" aria-label="number display" autofocus="" data-sharkid="__1">
      <div class="allButtons"> 
        <div class="buttonsOne">
          <button class="one">7</button>
          <button class="two">8</button>
          <button class="three">9</button>
        </div>
        <div class="buttonsTwo">
          <button class="four">4</button>
          <button class="five">5</button>
          <button class="six">6</button>
        </div>
        <div class="buttonsThree">
          <button class="seven">1</button>
          <button class="eight">2</button>
          <button class="nine">3</button>
        </div>
        <div class="buttonZero">
          <button class="zero">0</button>
        </div>
        <div class="operatorSymbols">
          <button class="plus">+</button>
          <button class="minus">-</button>
          <button class="times">x</button>
          <button class="divide">÷</button>
          <button class="equals">=</button>
        </div>
      </div> 




    </div>


    <script src="calculator.js"></script>
</body>
</html>
